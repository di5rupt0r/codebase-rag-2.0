[package]
name = "codebase-rag"
version = "2.0.0"
edition = "2021"
authors = ["Gabriel Silveira Benetti <34190521+di5rupt0r@users.noreply.github.com>"]
description = "AST-aware hybrid Codebase RAG & MCP Server for modern AI coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/di5rupt0r/codebase-rag-2.0"

[dependencies]
# CLI & Config
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"

# Full-Text & Lexical Index
tantivy = "0.22"

# Tree-sitter AST Parsers
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
tree-sitter-java = "0.21"

# File System & Gitignore
ignore = "0.4"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"

# Text & Matching
strsim = "0.11"
regex = "1.10"

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.10"
